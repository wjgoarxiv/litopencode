# Publishes @litfamily/litopencode from GitHub through npm trusted publishing, so each version carries a
# provenance statement tying the tarball to this repository and the commit it was built from. Start it by
# hand on main. Left at the default it is a dry run: the fast gates plus a pack check. With stage on,
# npm receives a staged version that stays private until the maintainer approves it on npmjs.com with 2FA.
# The suite and the QA probes do not run again here: ci.yml already ran them on the pushed commit, and the
# publish gate refuses unless that ci.yml run passed on this exact commit.
name: Publish

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Upload a staged version to npm (off = gates and pack check only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LITOPENCODE_PUBLISH_FROM_CI: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with staged publishing
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build

      - name: Run typecheck
        run: npm run typecheck

      - name: Run legacy-token scanner
        run: npm run scan:legacy-tokens

      - name: Run version lockstep check
        run: npm run check:version

      - name: Check managed skill manifest
        run: npm run check:managed-skill-manifest

      - name: Dry pack
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack-report.json"

      - name: Run pack payload guard
        run: node tools/check-pack-payload.mjs --file "$RUNNER_TEMP/pack-report.json"

      # prepublishOnly (tools/prepublish-test-gate.mjs) asks the GitHub API for a green ci.yml push run on
      # this commit inside npm stage publish; a dry run makes the same check as its own step.
      - name: ci.yml passed on this commit
        if: ${{ !inputs.stage }}
        run: node tools/prepublish-test-gate.mjs

      - name: Stage on npm (the gate checks ci.yml first)
        if: inputs.stage
        run: npm stage publish
