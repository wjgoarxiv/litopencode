# Publishes @litfamily/litopencode from GitHub through npm trusted publishing, so each version carries a
# provenance statement tying the tarball to this repository and the commit it was built from. Start it by
# hand on main. Left at the default it is a dry run: the same gates as CI plus a pack check. With stage on,
# npm receives a staged version that stays private until the maintainer approves it on npmjs.com with 2FA.
name: Publish

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Upload a staged version to npm (off = gates and pack check only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with staged publishing
        run: npm install -g npm@11.21.1

      # The motion score test encodes AAC through ffmpeg, which the Ubuntu runner image does not ship.
      - name: ffmpeg for the motion and audio tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build runtime for QA
        run: npm run build

      # prepublishOnly (tools/prepublish-test-gate.mjs) runs npm test inside npm stage publish,
      # so the suite runs here only on a dry run.
      - name: Run tests
        if: ${{ !inputs.stage }}
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run behavior replacement probes
        run: npm run qa:behavior-replacement

      - name: Run installed resource tamper probe
        run: npm run qa:installed-resource-tamper

      - name: Run negative gate matrix
        run: npm run qa:negative-gate-matrix

      - name: Run rules glob differential
        run: npm run qa:rules-glob-differential

      - name: Run Wikify surface probe
        run: node tools/run-wikify-surface-probe.mjs

      - name: Run legacy-token scanner
        run: npm run scan:legacy-tokens

      - name: Run version lockstep check
        run: npm run check:version

      - name: Check managed skill manifest
        run: npm run check:managed-skill-manifest

      - name: Dry pack
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack-report.json"

      - name: Run pack payload guard
        run: node tools/check-pack-payload.mjs --file "$RUNNER_TEMP/pack-report.json"

      - name: Stage on npm (runs the suite through prepublishOnly first)
        if: inputs.stage
        run: npm stage publish
