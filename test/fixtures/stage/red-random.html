<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>html, body { margin: 0; background: #101010; } #copy { position: absolute; left: 160px; top: 860px; font: 700 64px "LitOpenCode Sans"; color: #f0f0f0; } #box { position: absolute; width: 300px; height: 300px; background: #f0f0f0; }</style>
<div id="box"></div>
<div id="copy">지붕의 비가 사흘을 버틴다</div>
<script>
  // Reads an unseeded random source and paints it: two browsers never agree.
  const values = crypto.getRandomValues(new Uint16Array(2));
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4.2, render(t) { const box = document.getElementById("box"); box.style.left = `${values[0] % 1500}px`; box.style.top = `${values[1] % 700 + t * 10}px`; } });
</script>
