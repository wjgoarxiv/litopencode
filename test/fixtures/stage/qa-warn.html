<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>
  html, body { margin: 0; background: #14202a; overflow: hidden; }
  #copy { position: absolute; left: 200px; top: 700px; font: 700 72px "LitOpenCode Sans"; color: #f4f1e8; }
  #copy svg { width: 60px; height: 60px; vertical-align: middle; margin-left: 24px; display: none; }
  #label { position: absolute; left: 200px; top: 200px; font: 400 40px "Archivo"; color: #f4f1e8; }
  canvas { position: absolute; left: 1100px; top: 150px; }
  #shape { position: absolute; left: 1300px; top: 500px; width: 300px; height: 300px; border-radius: 50%; background: #d9a441; }
</style>
<div id="shape"></div>
<div id="label">treatment.json</div>
<div id="copy">고요한 정원의 아침<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="currentColor"/></svg></div>
<canvas id="c" width="600" height="200"></canvas>
<script>
  // Passes every FAIL check but raises each WARN: a file name on screen, canvas text drawn without
  // registration, and an icon that inherits the text colour (hiding the text moves it too).
  LitStage.text(document.getElementById("copy"));
  const ctx = document.getElementById("c").getContext("2d");
  LitStage.define({
    width: 1920, height: 1080, fps: 30, duration: 4.2,
    render(t) {
      ctx.clearRect(0, 0, 600, 200);
      ctx.fillStyle = "#f4f1e8"; ctx.font = "48px sans-serif"; ctx.fillText("canvas words", 20, 100);
      document.querySelector("#copy svg").style.display = t >= 1.4 && t < 2.8 ? "inline-block" : "none";
      document.getElementById("shape").style.transform = `translateY(${Math.sin(t) * 40}px)`;
    }
  });
</script>
