<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>
  html, body { margin: 0; background: #10202a; overflow: hidden; }
  svg { position: absolute; inset: 0; }
  .line { position: absolute; left: 160px; bottom: 150px; font: 700 72px "LitOpenCode Sans"; color: #e8eef0; }
  .pulse { position: absolute; right: 200px; top: 200px; width: 120px; height: 120px; border-radius: 50%; background: #c9a15a; animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(0.6); } to { transform: scale(1.1); } }
  .tick { position: absolute; left: 160px; top: 160px; width: 40px; height: 40px; background: #4fa3a5; }
</style>
<svg viewBox="0 0 1920 1080"><path id="arc" d="M200 700 C 600 200, 1300 200, 1700 700" fill="none" stroke="#4fa3a5" stroke-width="10"/><circle id="dot" r="36" fill="#e8eef0"/></svg>
<div class="pulse"></div>
<div class="tick" id="tick"></div>
<div class="line" id="copy">지붕의 비가 사흘을 버틴다</div>
<script>
  // Only clock sources the renderer drives: Date, performance.now, timers, requestAnimationFrame and a
  // CSS animation. No render(t): the page runs its own loop, as a hand-written animation would.
  const arc = document.getElementById("arc"), dot = document.getElementById("dot"), tick = document.getElementById("tick");
  LitStage.text(document.getElementById("copy"));
  const start = Date.now();
  let ticks = 0;
  setInterval(() => { ticks += 1; tick.style.transform = `translateX(${ticks * 24}px)`; }, 250);
  setTimeout(() => { document.getElementById("copy").style.color = "#ffffff"; }, 1500);
  function loop() {
    const t = (performance.now() + (Date.now() - start)) / 2000;
    const p = LitStage.ease.inOutSine(Math.min(1, t / 4.2));
    LitStage.drawPath(arc, p);
    const q = arc.getPointAtLength(arc.getTotalLength() * p);
    dot.setAttribute("cx", q.x); dot.setAttribute("cy", q.y);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4.2 });
</script>
