<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<link rel="stylesheet" href="/lit/style.css">
<script src="/lit/style.js"></script>
<script src="/lit/stage-kit.js"></script>
<style>
  html, body { margin: 0; background: #202020; }
  #swatch { position: absolute; left: 600px; top: 300px; width: 400px; height: 400px; background-color: rgb(0, 0, 0); transition: background-color 1s linear; }
  #swatch.on { background-color: rgb(200, 0, 0); }
</style>
<div id="swatch"></div>
<div class="lit-headline lit-ink" id="copy">지붕의 비가 사흘을 버틴다</div>
<script>
  LitStage.text(document.getElementById("copy"));
  // The transition starts when render() adds the class at t = 2 s; at t = 2.1 s it is 10 % along.
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4.2, render(t) { LitStage.place(document.getElementById("copy"), LitStage.shot(t).layout, "type"); document.getElementById("swatch").classList.toggle("on", t >= 2); } });
</script>
