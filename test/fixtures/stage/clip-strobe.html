<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<link rel="stylesheet" href="/lit/style.css">
<script src="/lit/style.js"></script>
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="lit-headline lit-ink" id="copy" style="z-index:2">지붕의 비가 사흘을 버틴다</div>
<script>
  LitStage.text(document.getElementById("copy"));
  // A declared clip stretched over the whole frame: two white frames, two black frames, repeated, 7.5 flashes a second.
  const show = LitStage.clip({ parent: document.getElementById("stage"), id: "strobe", box: { x: 0, y: 0, w: 1920, h: 1080 } });
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4.2, render(t) { LitStage.place(document.getElementById("copy"), LitStage.shot(t).layout, "type"); show(t, { start: 0, loop: true }); } });
</script>
</body>
</html>
