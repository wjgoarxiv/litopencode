<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>html, body { margin: 0; background: #101010; } #copy { position: absolute; left: 160px; top: 860px; font: 700 64px "LitOpenCode Sans"; color: #f0f0f0; } #bar { position: absolute; left: 0; top: 400px; height: 280px; background: #f0f0f0; }</style>
<div id="bar"></div>
<div id="copy">지붕의 비가 사흘을 버틴다</div>
<script>
  // Reads a clock source the renderer does not drive and paints it: two browsers never agree.
  const origin = performance.timeOrigin;
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4.2, render(t) { document.getElementById("bar").style.width = `${200 + (origin % 1000) + t * 100}px`; } });
</script>
