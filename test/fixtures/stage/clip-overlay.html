<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<link rel="stylesheet" href="/lit/style.css">
<script src="/lit/style.js"></script>
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="lit-headline lit-ink" id="copy">지붕의 비가 사흘을 버틴다</div>
<script>
  LitStage.text(document.getElementById("copy"));
  // One keyed clip cued at 0.5 s and held after its last frame until 2.4 s: its frame is a function of t alone.
  const show = LitStage.clip({ parent: document.getElementById("stage"), id: "swatch", box: { x: 600, y: 300, w: 400, h: 300 } });
  LitStage.define({ width: 1920, height: 1080, fps: 30, duration: 4.2, render(t) { LitStage.place(document.getElementById("copy"), LitStage.shot(t).layout, "type"); show(t, { start: 0.5, hold: t < 2.4 }); } });
</script>
</body>
</html>
