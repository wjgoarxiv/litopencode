<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/stage-kit.js"></script>
<style>
  :root { --ink:#080D14; --cream:#F2EFDF; --ember:#FF6337; --lime:#D7F75B; --panel:#111823; --raised:#1A2330; --muted:#8A97A6; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--ink); }
  body { position:relative; color:var(--cream); font-family:"Pretendard", sans-serif; font-weight:700; }
  #bg { position:absolute; inset:0; background:
      radial-gradient(1200px 760px at 84% 112%, rgba(255,99,55,.13), rgba(255,99,55,0) 62%),
      radial-gradient(900px 600px at 6% -12%, rgba(215,247,91,.04), rgba(215,247,91,0) 60%), var(--ink); }
  #glow { position:absolute; left:940px; top:200px; width:920px; height:720px; border-radius:50%;
          background:radial-gradient(closest-side, rgba(255,99,55,.30), rgba(255,99,55,0)); }
  #vig { position:absolute; inset:0; background:radial-gradient(1500px 950px at 50% 50%, rgba(8,13,20,0) 58%, rgba(8,13,20,.7) 100%); }

  #brand { position:absolute; left:0; top:0; white-space:nowrap; font:700 28px/1 "Pretendard", sans-serif; letter-spacing:.14em; color:var(--cream); transform-origin:0 0; }
  #brand b { color:var(--ember); font-weight:700; }

  .hl { position:absolute; left:140px; top:210px; width:850px; height:660px; margin:0; display:flex; align-items:center;
        font:700 108px/1.22 "Pretendard", sans-serif; letter-spacing:0; color:var(--cream); }
  .w { display:inline-block; overflow:hidden; vertical-align:top; padding:.08em 0 .16em; margin:-.08em 0 -.16em; }
  .wi { display:inline-block; will-change:transform; }
  .em { color:var(--ember); } .lm { color:var(--lime); }

  #gw { position:absolute; left:990px; top:130px; height:800px; transform-origin:50% 50%; }
  #giant { position:relative; font:700 800px/800px "Pretendard", sans-serif; letter-spacing:-.045em; color:var(--cream); white-space:nowrap; }
  .dot { position:absolute; border-radius:50%; background:var(--ember); }

  #pane { position:absolute; left:1010px; top:230px; width:780px; height:620px; border-radius:22px; background:var(--panel);
          border:2px solid rgba(242,239,223,.14); box-shadow:0 44px 100px rgba(0,0,0,.6); overflow:hidden; transform-origin:50% 50%; }
  #bar { position:absolute; left:0; top:0; right:0; height:56px; background:#0E1520; border-bottom:1px solid rgba(242,239,223,.07); }
  .pd { position:absolute; top:21px; width:14px; height:14px; border-radius:50%; background:#2A3546; }
  #ttl { position:absolute; left:0; right:0; top:0; height:56px; text-align:center; font:400 21px/56px "MesloLGS NF", monospace; color:var(--muted); }
  .sc { position:absolute; left:0; top:56px; width:780px; height:564px; }
  .mono { font-family:"MesloLGS NF", monospace; font-weight:400; }
  .pp { position:absolute; left:40px; width:700px; height:116px; background:var(--raised); border-radius:6px; }
  .pp i { position:absolute; left:0; top:0; bottom:0; width:7px; border-radius:6px 0 0 6px; background:var(--ember); }
  .pt { position:absolute; left:38px; top:0; line-height:116px; white-space:pre; font:400 25px/116px "MesloLGS NF", monospace; color:var(--cream); }
  .caret { display:inline-block; width:14px; height:32px; margin-left:2px; vertical-align:-7px; background:var(--cream); }
  #toast { position:absolute; left:60px; top:56px; width:660px; height:112px; background:#151A22; }
  #toast .e { position:absolute; top:0; bottom:0; width:6px; background:var(--ember); }
  #toast svg { position:absolute; left:36px; top:30px; }
  #toast .tx { position:absolute; left:96px; top:0; line-height:112px; font:400 30px/112px "MesloLGS NF", monospace; white-space:nowrap; color:var(--cream); }
  #ph { position:absolute; left:40px; top:28px; font:400 36px/52px "MesloLGS NF", monospace; color:var(--cream); }
  .row { position:absolute; left:40px; width:700px; height:104px; border-radius:12px; background:var(--raised); overflow:hidden; }
  .row .tint { position:absolute; inset:0; background:rgba(255,99,55,.15); border-left:6px solid var(--ember); }
  .row .lb { position:absolute; left:40px; top:0; line-height:104px; font:400 40px/104px "MesloLGS NF", monospace; color:var(--cream); }
  .row svg { position:absolute; left:452px; top:26px; }
  .row .dn { position:absolute; right:24px; top:30px; height:44px; padding:0 20px; border-radius:22px; background:var(--ember); color:#080D14; font:400 24px/44px "MesloLGS NF", monospace; }
  .nl { position:absolute; top:236px; width:180px; margin-left:-90px; text-align:center; font:400 27px/34px "MesloLGS NF", monospace; color:var(--cream); }
  #fp { position:absolute; left:40px; top:408px; height:50px; font:400 28px/50px "MesloLGS NF", monospace; color:var(--lime); white-space:pre; }
  .rr { position:absolute; left:40px; width:700px; height:96px; border-radius:12px; background:var(--raised); }
  .rr .lb { position:absolute; left:104px; top:0; line-height:96px; font:400 32px/96px "MesloLGS NF", monospace; color:var(--cream); }
  .rr .rt { position:absolute; right:30px; top:0; line-height:96px; font:400 26px/96px "MesloLGS NF", monospace; color:var(--muted); }
  .rr svg { position:absolute; left:34px; top:24px; }
  #sweep { position:absolute; top:56px; height:564px; width:4px; margin-left:-2px; background:var(--ember); box-shadow:0 0 28px 6px rgba(255,99,55,.55); }
  #final { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  #fl { position:absolute; left:0; width:1920px; top:400px; height:200px; display:flex; align-items:center; justify-content:center;
        font:700 156px/1.06 "Pretendard", sans-serif; letter-spacing:-.025em; color:var(--cream); }
</style>
<body>
  <div id="bg"></div>
  <div id="glow"></div>
  <div id="brand"><b>Lit</b>OpenCode</div>

  <h1 class="hl" id="h0"><span class="t"></span></h1>
  <h1 class="hl" id="h1"><span class="t"></span></h1>
  <h1 class="hl" id="h2"><span class="t"></span></h1>
  <h1 class="hl" id="h3"><span class="t"></span></h1>
  <h1 class="hl" id="h4"><span class="t"></span></h1>

  <div id="pane">
    <div id="bar"><i class="pd" style="left:22px"></i><i class="pd" style="left:46px"></i><i class="pd" style="left:70px"></i><div id="ttl">OpenCode</div></div>

    <div class="sc" id="s1">
      <div class="pp" id="pp1" style="top:372px"><i></i>
        <div class="pt" id="pt1"><span id="pl" style="color:#FF6337">lit</span><span id="pr"></span><span class="caret" id="c1"></span></div>
      </div>
      <div id="toast"><div class="e" style="left:0"></div><div class="e" style="right:0"></div>
        <svg width="36" height="42" viewBox="0 0 24 28"><path d="M12 1c.6 4.6 7.8 7.2 7.8 14.4A7.8 7.8 0 0 1 12 27a7.8 7.8 0 0 1-7.8-11.6c.4 2.2 1.6 3.4 2.9 3.6C6.5 14 8.6 6.2 12 1z" fill="#FF6337"/><path d="M12 14c.3 2.3 3.2 3.4 3.2 6.1a3.2 3.2 0 0 1-6.4 0c0-1.6 1-2.4 1.6-3.2.6.7 1.3.9 1.6.6z" fill="#D7F75B"/></svg>
        <div class="tx" id="tt">LIT IGNITED · lit-loop</div>
      </div>
    </div>

    <div class="sc" id="s2">
      <div id="ph">lit-plan</div>
    </div>

    <div class="sc" id="s3">
      <svg width="780" height="300" viewBox="0 0 780 300" style="position:absolute;left:0;top:0">
        <path id="cp0" d="M110 150 H670" stroke="#2A3648" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path id="cp1" d="M110 150 H670" stroke="#D7F75B" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
      <div id="nodes"></div>
      <div id="fp">litgoal/</div>
    </div>

    <div class="sc" id="s4">
      <div class="pp" id="pp4" style="top:28px"><i></i><div class="pt" id="pt4"><span id="p4a"></span><span class="caret" id="c4"></span></div></div>
    </div>

    <div id="sweep"></div>
  </div>

  <div id="gw"><div id="giant">lit</div><i class="dot" id="gdot"></i></div>

  <div id="final"><div id="fl"><span class="t"></span></div><i class="dot" id="fdot"></i></div>

  <script>
    const COPY = {
      giant: "lit",
      h0: "한 단어를 붙이세요.",
      h1: "워크플로가 켜집니다.",
      h2: "계획 에이전트는 읽기만 합니다.",
      h3: "모든 단계가 기록으로 남습니다.",
      h4: "멈춘 곳에서 이어가세요.",
      final: "Keep the work lit.",
      brand: "LitOpenCode"
    };
    const UI = { prompt: " Build a to-do list in one index.html", recap: "/lit-recap", nodes: ["Plan", "Build", "Verify", "Next"],
                 rows: ["edit", "bash", "task"], recapRows: ["Done", "Checked", "Next step"] };
    const { define, text, ease, at, kf, spring, drawPath, lerp, clamp, cubicBezier } = LitStage;
    const $ = (id) => document.getElementById(id);
    const NS = "http://www.w3.org/2000/svg";
    const EMBER = "#FF6337", LIME = "#D7F75B";
    const DUR = 22;

    /* ---------- tunables for the ember dots on the letter i ---------- */
    const GDOT = { x: 0.0, y: 0.0, r: 0.0 };   // measured on first frame from the glyph run
    function measureDot(el, fontPx, charIndex) {
      const tn = el.firstChild;
      const r = document.createRange();
      r.setStart(tn, charIndex); r.setEnd(tn, charIndex + 1);
      return r.getBoundingClientRect();
    }

    // headlines
    function buildHeadline(id, str, accents) {
      const h = $(id), t = h.querySelector(".t");
      const words = str.split(" "), inners = [];
      words.forEach((w, i) => {
        const outer = document.createElement("span"); outer.className = "w";
        const inner = document.createElement("span"); inner.className = "wi"; inner.textContent = w;
        if (accents[w]) inner.classList.add(accents[w]);
        outer.appendChild(inner); t.appendChild(outer); inners.push(inner);
        if (i < words.length - 1) t.appendChild(document.createTextNode(" "));
      });
      text(h);
      return { el: h, words: inners };
    }
    const H = [
      buildHeadline("h0", COPY.h0, { "단어를": "em" }),
      buildHeadline("h1", COPY.h1, { "켜집니다.": "em" }),
      buildHeadline("h2", COPY.h2, { "읽기만": "em" }),
      buildHeadline("h3", COPY.h3, { "기록으로": "lm" }),
      buildHeadline("h4", COPY.h4, { "이어가세요.": "lm" })
    ];
    function headline(ttl, t, tin, tout) {
      let any = 0;
      ttl.words.forEach((w, i) => {
        const pin = at(t, tin + i * 0.12, 1.0, cubicBezier(0.25, 1, 0.4, 1));
        const pout = at(t, tout + i * 0.06, 0.55, ease.inOutSine);
        const y = (1 - pin) * 110 - pout * 70;
        w.style.transform = "translateY(" + y.toFixed(2) + "%)";
        w.style.opacity = (Math.min(1, pin * 3) * (1 - pout)).toFixed(3);
        if (pin > 0 && pout < 1) any = 1;
      });
      ttl.el.style.visibility = any ? "visible" : "hidden";
    }

    // final line: build with per-word masks; the last word's i gets an ember dot
    const fl = $("fl").querySelector(".t");
    const FW = COPY.final.split(" ");
    const FI = FW.map((w, i) => {
      const outer = document.createElement("span"); outer.className = "w";
      const inner = document.createElement("span"); inner.className = "wi"; inner.textContent = w;
      outer.appendChild(inner); fl.appendChild(outer);
      if (i < FW.length - 1) fl.appendChild(document.createTextNode(" "));
      return inner;
    });
    text($("fl"));
    text($("giant")); text($("brand"));

    // decor text inside the drawn pane
    ["ttl", "tt", "ph", "fp", "pt1", "pt4"].forEach((id) => text($(id), { decor: true }));

    // planner rows
    const s2 = $("s2");
    const lockSvg = '<svg width="52" height="52" viewBox="0 0 24 24"><g class="shk"><path class="sh" d="M8 11V7.5a4 4 0 0 1 8 0V11" fill="none" stroke="#F2EFDF" stroke-width="2" stroke-linecap="round"/></g><rect x="5" y="11" width="14" height="10" rx="2.2" fill="#F2EFDF"/><circle cx="12" cy="16" r="1.5" fill="#1A2330"/></svg>';
    const rowEls = UI.rows.map((name, i) => {
      const r = document.createElement("div"); r.className = "row"; r.style.top = (112 + i * 128) + "px";
      r.innerHTML = '<div class="tint"></div><div class="lb">' + name + "</div>" + lockSvg + '<div class="dn">deny</div>';
      s2.appendChild(r);
      text(r.querySelector(".lb"), { decor: true }); text(r.querySelector(".dn"), { decor: true });
      return { el: r, tint: r.querySelector(".tint"), shk: r.querySelector(".shk"), sh: r.querySelector(".sh"), dn: r.querySelector(".dn"), svg: r.querySelector("svg") };
    });

    // chain nodes
    const nodesEl = $("nodes"), s3 = $("s3");
    const nodeX = [110, 297, 483, 670];
    const nodeEls = UI.nodes.map((name, i) => {
      const s = document.createElementNS(NS, "svg"); s.setAttribute("width", 110); s.setAttribute("height", 110); s.setAttribute("viewBox", "-55 -55 110 110");
      s.style.cssText = "position:absolute;left:" + (nodeX[i] - 55) + "px;top:" + (150 - 55) + "px;overflow:visible";
      const ring = document.createElementNS(NS, "circle"); ring.setAttribute("r", 38); ring.setAttribute("fill", "#111823"); ring.setAttribute("stroke", i === 3 ? EMBER : LIME); ring.setAttribute("stroke-width", 6);
      s.appendChild(ring);
      let fill = null, chk = null;
      if (i < 3) {
        fill = document.createElementNS(NS, "circle"); fill.setAttribute("r", 38); fill.setAttribute("fill", LIME);
        chk = document.createElementNS(NS, "path"); chk.setAttribute("d", "M-15 1 L-4 12 L17 -11"); chk.setAttribute("stroke", "#080D14"); chk.setAttribute("stroke-width", 9); chk.setAttribute("fill", "none"); chk.setAttribute("stroke-linecap", "round"); chk.setAttribute("stroke-linejoin", "round");
        s.appendChild(fill); s.appendChild(chk);
      } else {
        const play = document.createElementNS(NS, "path"); play.setAttribute("d", "M-10 -16 L17 0 L-10 16 Z"); play.setAttribute("fill", EMBER); s.appendChild(play);
      }
      nodesEl.appendChild(s);
      const lab = document.createElement("div"); lab.className = "nl"; lab.style.left = nodeX[i] + "px"; lab.textContent = name; s3.appendChild(lab); text(lab, { decor: true });
      return { s, fill, chk, lab };
    });

    // recap rows
    const s4 = $("s4");
    const tick = '<svg width="48" height="48" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#D7F75B"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#080D14" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const playIc = '<svg width="48" height="48" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#FF6337" stroke-width="2.6"/><path d="M9.5 8.3l6 3.7-6 3.7z" fill="#FF6337"/></svg>';
    const recapEls = UI.recapRows.map((name, i) => {
      const r = document.createElement("div"); r.className = "rr"; r.style.top = (188 + i * 112) + "px";
      r.innerHTML = (i < 2 ? tick : playIc) + '<div class="lb"' + (i === 2 ? ' style="color:#D7F75B"' : "") + ">" + name + "</div>";
      if (i === 0) r.insertAdjacentHTML("beforeend", '<div class="rt">index.html</div>');
      s4.appendChild(r); text(r.querySelector(".lb"), { decor: true }); if (i === 0) text(r.querySelector(".rt"), { decor: true });
      return r;
    });

    const gw = $("gw"), gdot = $("gdot"), fdot = $("fdot"), pane = $("pane"), glow = $("glow"), brand = $("brand");
    const sweep = $("sweep");
    const sc = [$("s1"), $("s2"), $("s3"), $("s4")];
    const toast = $("toast"), pp1 = $("pp1");

    const sprToast = spring({ stiffness: 240, damping: 14 });
    const sprLock = spring({ stiffness: 460, damping: 12 });
    const sprNode = spring({ stiffness: 300, damping: 15 });
    const sprDot = spring({ stiffness: 220, damping: 11 });
    const easeMain = cubicBezier(0.7, 0, 0.2, 1);
    const easeOut = cubicBezier(0.16, 1, 0.3, 1);

    let measured = false, gwW = 0, dotFinal = null, brandW = 214;  // the name's visible width at 28px, measured on the rendered frame
    function measure() {
      const saved = [gw.style.transform, ...FI.map((w) => w.style.transform)];
      gw.style.transform = "none"; FI.forEach((w) => { w.style.transform = "none"; });
      // giant: place the ember dot over the glyph's own dot
      const giant = $("giant");
      const rect = measureDot(giant, 800, 1);
      const host = gw.getBoundingClientRect();
      gwW = giant.getBoundingClientRect().width;
      gw.style.width = gwW + "px";
      const cx = rect.left - host.left + rect.width * GD.cxk + 800 * 0.0225;
      const cy = rect.top - host.top + 800 * GD.cyk;
      const r = 800 * GD.rk;
      gdot.style.cssText = "left:" + (cx - r) + "px;top:" + (cy - r) + "px;width:" + (2 * r) + "px;height:" + (2 * r) + "px";
      GDOT.x = cx; GDOT.y = cy; GDOT.r = r;
      // final line
      const wi = FI[FI.length - 1];
      const flPx = 156;
      const rr = measureDot(wi, flPx, 1);
      const fcx = rr.left + rr.width * GD.cxk + flPx * 0.0125, fcy = rr.top + flPx * GD.cyk, fr = flPx * GD.rk;
      fdot.style.cssText = "left:" + (fcx - fr) + "px;top:" + (fcy - fr) + "px;width:" + (2 * fr) + "px;height:" + (2 * fr) + "px";
      dotFinal = { x: fcx, y: fcy, r: fr };
      gw.style.transform = saved[0]; FI.forEach((w, i) => { w.style.transform = saved[i + 1]; });
      measured = true;
    }
    const GD = { cxk: 0.5, cyk: 0.281, rk: 0.083 };  // fractions of the font size; tuned by eye on stills

    const cuts = [0, 3.6, 5.2, 7.4, 8.8, 11.2, 15.0, 18.4, 22];

    define({ width: 1920, height: 1080, fps: 60, duration: DUR, render(t) {
      if (!measured) measure();

      // ---- background light
      const breathe = 0.5 + 0.5 * Math.sin(t * 0.9);
      const gPos = kf(t, [{ t: 0, v: 0 }, { t: 18.4, v: 0 }, { t: 19.4, v: 1, ease: "inOutSine" }]);
      glow.style.left = lerp(940, 500, gPos) + "px";
      glow.style.top = lerp(200, 170, gPos) + "px";
      glow.style.opacity = (0.75 + 0.25 * breathe - 0.18 * gPos).toFixed(3);

      // ---- corner name -> centre name
      const bw = brandW, bh = 28;
      const bp = at(t, 19.3, 1.2, easeMain);
      const S = 1.5;
      const bx = lerp(150, 960 - bw * S / 2, bp), by = lerp(96, 690, bp);
      brand.style.transform = "translate(" + bx.toFixed(2) + "px," + by.toFixed(2) + "px) scale(" + lerp(1, S, bp).toFixed(4) + ")";
      brand.style.opacity = at(t, 0.15, 0.7, ease.decelerate).toFixed(3);

      // ---- headlines
      headline(H[0], t, 0.35, 3.05);
      headline(H[1], t, 3.95, 7.0);
      headline(H[2], t, 7.6, 10.9);
      headline(H[3], t, 11.55, 14.7);
      headline(H[4], t, 15.35, 18.05);

      // ---- giant lit and hand-off into the prompt
      const TX = 1111, TY = 740;                 // centre of the prompt's lit
      const c0x = 990 + gwW / 2, c0y = 130 + 400 + 40;
      const hp = at(t, 2.85, 1.2, cubicBezier(0.45, 0, 0.2, 1));
      const sc0 = Math.exp(lerp(0, Math.log(0.058), hp));
      const drift = 1 + 0.018 * at(t, 0, 3.2, ease.inOutSine);
      gw.style.transform = "translate(" + ((TX - c0x) * hp).toFixed(2) + "px," + ((TY - c0y) * hp).toFixed(2) + "px) scale(" + (sc0 * drift).toFixed(5) + ")";
      const gAlpha = 1 - at(t, 3.85, 0.2, ease.standard);
      gw.style.opacity = gAlpha.toFixed(3);
      gw.style.visibility = gAlpha > 0 ? "visible" : "hidden";
            const gdScale = 1 + 0.28 * Math.sin(Math.min(1, Math.max(0, (t - 0.75) / 0.9)) * Math.PI) * (1 - 0.15 * Math.min(1, Math.max(0, (t - 0.75) / 0.9)));
      gdot.style.transform = "scale(" + (1.02 * (t < 0.75 ? 1 : gdScale)).toFixed(4) + ")";
      gdot.style.boxShadow = "0 0 " + (40 + 60 * Math.max(0, Math.sin(Math.min(1, Math.max(0, (t - 0.75) / 0.9)) * Math.PI))).toFixed(1) + "px rgba(255,99,55,.6)";

      // ---- pane
      const pin = at(t, 3.35, 0.7, easeOut);
      const pout = at(t, 18.45, 1.05, easeMain);
      const tgt = dotFinal || { x: 1130, y: 470 };
      const pcx = 1010 + 390, pcy = 230 + 310;
      const ps = lerp(0.94, 1, pin) * (1 - pout * 0.985);
      pane.style.opacity = (pin * (1 - at(t, 19.15, 0.3, ease.standard))).toFixed(3);
      pane.style.transform = "translate(" + ((tgt.x - pcx) * pout).toFixed(2) + "px," + (((tgt.y - pcy) * pout) + (1 - pin) * 26).toFixed(2) + "px) scale(" + ps.toFixed(4) + ")";
      pane.style.visibility = (pin > 0 && t < 19.5) ? "visible" : "hidden";

      // ---- scene visibility with ember-line sweeps
      const sw = [7.4, 11.2, 15.0].map((s) => at(t, s, 0.62, cubicBezier(0.65, 0, 0.25, 1)));
      const cur = t < 7.4 ? 0 : t < 11.2 ? 1 : t < 15.0 ? 2 : 3;
      let sweepX = -100;
      sc.forEach((el, i) => {
        let clip = "none", vis = "hidden";
        if (i === cur) {
          vis = "visible";
          if (i > 0) { const p = sw[i - 1]; if (p < 1) clip = "inset(0 " + ((1 - p) * 780).toFixed(1) + "px 0 0)"; }
        } else if (i === cur - 1) {
          const p = sw[i]; if (p < 1) { vis = "visible"; clip = "inset(0 0 0 " + (p * 780).toFixed(1) + "px)"; }
        }
        el.style.visibility = vis; el.style.clipPath = clip;
      });
      sw.forEach((p) => { if (p > 0 && p < 1) sweepX = p * 780; });
      sweep.style.left = sweepX.toFixed(1) + "px";
      sweep.style.opacity = sweepX < 0 ? "0" : (1 - 0.0).toFixed(2);

      // ---- scene 1: prompt typing, toast
      const typeN = Math.floor(clamp((t - 4.25) / (5.05 - 4.25), 0, 1) * UI.prompt.length + 1e-6);
      $("pr").textContent = UI.prompt.slice(0, typeN);
      const caretOn = (t > 3.9 && t < 7.4) && (typeN < UI.prompt.length ? true : Math.floor((t - 5.05) * 2.2) % 2 === 0);
      $("c1").style.opacity = caretOn ? "1" : "0";
      $("pl").style.opacity = at(t, 3.87, 0.2, ease.standard).toFixed(3);
      const tp = sprToast(t - 5.2);
      const tin = at(t, 5.2, 0.28, ease.decelerate);
      toast.style.opacity = tin.toFixed(3);
      toast.style.transform = "translateY(" + ((1 - tp) * -64).toFixed(2) + "px)";

      // ---- scene 2: planner rows and locks
      const ph = $("ph");
      ph.style.opacity = at(t, 7.6, 0.45, ease.decelerate).toFixed(3);
      rowEls.forEach((r, i) => {
        const rin = at(t, 7.68 + i * 0.14, 0.7, easeOut);
        const lp = sprLock(t - (8.8 + i * 0.55));
        const closed = t >= 8.8 + i * 0.55;
        r.el.style.opacity = rin.toFixed(3);
        r.el.style.transform = "translateY(" + ((1 - rin) * 46).toFixed(2) + "px)";
        r.tint.style.opacity = closed ? at(t, 8.8 + i * 0.55, 0.3, ease.decelerate).toFixed(3) : "0";
        r.dn.style.opacity = closed ? at(t, 8.85 + i * 0.55, 0.25, ease.decelerate).toFixed(3) : "0";
        r.dn.style.transform = "translateX(" + ((1 - (closed ? at(t, 8.85 + i * 0.55, 0.35, easeOut) : 0)) * 30).toFixed(2) + "px)";
        // shackle: open (raised, tilted) until the lock closes
        const open = closed ? Math.max(0, 1 - lp) : 1;
        r.sh.setAttribute("transform", "translate(" + (open * 3.2).toFixed(2) + " " + (-open * 3.4).toFixed(2) + ") rotate(" + (open * 24).toFixed(1) + " 8 11)");
        r.svg.style.transform = "translateX(" + (closed ? Math.sin((t - (8.8 + i * 0.55)) * 60) * 3 * Math.max(0, 1 - (t - (8.8 + i * 0.55)) / 0.25) : 0).toFixed(2) + "px)";
      });

      // ---- scene 3: chain
      const cdraw = at(t, 11.9, 2.0, cubicBezier(0.5, 0, 0.2, 1));
      const c1 = $("cp1"); drawPath(c1, cdraw);
      nodeEls.forEach((n, i) => {
        const fireT = 12.2 + i * 0.55;
        const np = sprNode(t - fireT);
        const s = t < fireT ? 0 : np;
        const show = at(t, 11.75 + i * 0.1, 0.4, ease.decelerate);
        n.s.style.opacity = show.toFixed(3);
        n.s.style.transform = "scale(" + (t < fireT ? 1 : 1 + 0.16 * Math.max(0, 1 - Math.abs(np - 1) * 3)).toFixed(4) + ")";
        if (n.fill) { n.fill.setAttribute("opacity", (t < fireT ? 0 : Math.min(1, s * 1.5)).toFixed(3)); n.fill.setAttribute("r", (38 * Math.max(0.001, t < fireT ? 0.001 : Math.min(1.08, s))).toFixed(2)); }
        if (n.chk) n.chk.setAttribute("opacity", (t < fireT + 0.12 ? 0 : Math.min(1, (t - fireT - 0.12) / 0.16)).toFixed(3));
        n.lab.style.opacity = show.toFixed(3);
      });
      $("fp").style.opacity = at(t, 13.9, 0.6, ease.decelerate).toFixed(3);
      $("fp").style.transform = "translateY(" + ((1 - at(t, 13.9, 0.7, easeOut)) * 20).toFixed(2) + "px)";

      // ---- scene 4: recap
      const n4 = Math.floor(clamp((t - 15.75) / (16.55 - 15.75), 0, 1) * UI.recap.length + 1e-6);
      $("p4a").textContent = UI.recap.slice(0, n4);
      const c4on = (t > 15.4 && t < 18.4) && (n4 < UI.recap.length ? true : Math.floor((t - 16.55) * 2.2) % 2 === 0);
      $("c4").style.opacity = c4on ? "1" : "0";
      recapEls.forEach((r, i) => {
        const ri = at(t, 16.95 + i * 0.35, 0.7, easeOut);
        r.style.opacity = ri.toFixed(3);
        r.style.transform = "translateY(" + ((1 - ri) * 40).toFixed(2) + "px)";
      });

      // ---- final line and returning dot
      const fin = FI;
      fin.forEach((w, i) => {
        const p = at(t, 18.85 + i * 0.13, 1.0, cubicBezier(0.25, 1, 0.4, 1));
        w.style.transform = "translateY(" + ((1 - p) * 110).toFixed(2) + "%)"; w.style.opacity = Math.min(1, p * 3).toFixed(3);
      });
      $("fl").style.visibility = t >= 18.8 ? "visible" : "hidden";
      const fdp = t < 19.35 ? 0 : sprDot(t - 19.35);
      const fpulse = 1 + 0.5 * Math.sin(clamp((t - 20.3) / 0.9, 0, 1) * Math.PI);
      fdot.style.transform = "scale(" + (Math.max(0.001, fdp) * (1.0) * fpulse * 1.06).toFixed(4) + ")";
      fdot.style.boxShadow = "0 0 " + (30 + 50 * Math.sin(clamp((t - 20.3) / 0.9, 0, 1) * Math.PI)).toFixed(1) + "px rgba(255,99,55,.55)";
      fdot.style.opacity = t < 19.35 ? "0" : "1";
    } });
  </script>
</body>
